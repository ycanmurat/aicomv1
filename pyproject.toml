[project]
name = "aicomv1"
version = "0.1.0"
description = "Tamamen yerel, Turkce, gercek zamanli yapay zeka sesli iletisim asistani"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]
freya = [
    "einops>=0.8,<1",
    "huggingface-hub>=1,<2",
    "librosa>=0.11,<1",
    "numpy>=2,<3",
    "safetensors>=0.6,<1",
    "soundfile>=0.13,<1",
    "torch>=2.8,<3",
    "voxcpm>=2,<3",
]

[project.scripts]
aicom = "aicomv1.api:main"
aicom-doctor = "aicomv1.doctor:main"
aicom-benchmark = "aicomv1.benchmark:main"
aicom-smoke = "aicomv1.smoke:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicomv1"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
